name: build-fw

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - patch/**
      - files/**
      - .github/workflows/build-fw.yml

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: deps
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y nasm iasl uuid-dev mono-devel python3-pip
          python3 -m pip install --break-system-packages -q edk2-pytool-extensions edk2-pytool-library regex
          python3 -c "import edk2toolext, regex, sys; print('deps ok', sys.version)"

      - name: sources
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/Project-Silicium/Mu-Silicium.git mu
          git -C mu fetch --depth 1 origin 20b82927b64f4d601d4f01e1bb3312071e437ba5
          git -C mu checkout -q FETCH_HEAD
          git -C mu submodule update --init --depth 1 || true

          git clone --filter=blob:none https://github.com/UniXNU/UniXNU.git unixnu
          git -C unixnu fetch --depth 1 origin 8ec13bb1077502e53e8ba3b82c56842589b5c837
          git -C unixnu checkout -q FETCH_HEAD
          git -C unixnu submodule update --init --depth 1 drivers/DarwinBoot
          git -C unixnu/drivers/DarwinBoot log --oneline -1

      - name: patch
        run: |
          set -euo pipefail
          cd mu
          git apply --whitespace=nowarn ../patch/mu-silicium.patch || patch -p1 < ../patch/mu-silicium.patch
          mkdir -p Platforms/OnePlus/kebabPkg/Drivers/KebabLogDxe
          cp ../files/KebabLogDxe.c ../files/KebabLogDxe.inf Platforms/OnePlus/kebabPkg/Drivers/KebabLogDxe/
          sed -i 's/EnableDisplayThread = 0x1/EnableDisplayThread = 0x0/' Binaries/kebab/RawFiles/uefiplat.cfg || true
          cd ../unixnu/drivers/DarwinBoot
          git apply --whitespace=nowarn ../../../patch/darwinboot.patch || patch -p1 < ../../../patch/darwinboot.patch
          grep -n "PaintBand" DarwinBootPkg/Driver/DarwinBoot.c
          cd ../../..
          # bring UniXNU packages into the Mu-Silicium tree and add them to its search path
          cp -r unixnu/package/UniXNUPkg mu/UniXNUPkg
          cp -r unixnu/drivers/DarwinBoot/DarwinBootPkg mu/DarwinBootPkg
          python3 - <<'PY'
          p = 'mu/Platforms/OnePlus/kebabPkg/DeviceBuild.py'
          s = open(p, encoding='utf-8').read()
          needle = '        "Silicium-ACPI/Platforms/OnePlus",'
          assert needle in s, 'PackagesPath anchor not found'
          s = s.replace(needle, needle + '\n        "UniXNUPkg",\n        "DarwinBootPkg",', 1)
          open(p, 'w', encoding='utf-8', newline='\n').write(s)
          print('PackagesPath patched')
          PY
          grep -n "UniXNUPkg\|DarwinBootPkg" mu/Platforms/OnePlus/kebabPkg/DeviceBuild.py | head

      - name: build
        run: |
          set -euo pipefail
          cd mu
          python3 Platforms/OnePlus/kebabPkg/DeviceBuild.py --setup -t DEBUG 2>&1 | tail -40
          python3 Platforms/OnePlus/kebabPkg/DeviceBuild.py --update -t DEBUG 2>&1 | tail -40
          python3 Platforms/OnePlus/kebabPkg/DeviceBuild.py TARGET=DEBUG ENABLE_SECUREBOOT=0 FD_BASE=0x9fc00000 FD_SIZE=0x300000 FD_BLOCKS=0x300 DEVICE_MODEL=0 2>&1 | tail -80

      - name: verify
        run: |
          set -euo pipefail
          FD=mu/Build/kebabPkg/DEBUG_CLANGPDB/FV/SILICIUM_UEFI.fd
          ls -l "$FD"
          SIZE=$(stat -c%s "$FD")
          echo "fd size = $SIZE"
          test "$SIZE" -eq 3145728

      - uses: actions/upload-artifact@v4
        with:
          name: SILICIUM_UEFI
          path: mu/Build/kebabPkg/DEBUG_CLANGPDB/FV/SILICIUM_UEFI.fd
          if-no-files-found: error
